name: Release

on:
  push:
    tags: ['*.*.*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Validate release metadata and extract notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const manifest = require('./manifest.json');
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          const versions = require('./versions.json');
          assert.match(manifest.version, /^\d+\.\d+\.\d+$/);
          for (const version of [pkg.version, lock.version, lock.packages[''].version, process.env.RELEASE_TAG]) {
            assert.equal(version, manifest.version);
          }
          assert.equal(versions[manifest.version], manifest.minAppVersion);
          const section = fs.readFileSync('CHANGELOG.md', 'utf8').split(/^## /m)
            .find(text => text.startsWith(`[${manifest.version}] `));
          assert.ok(section, 'The release needs a changelog entry');
          fs.writeFileSync('release-notes.md', `## ${section.trim()}\n`);
          NODE
      - name: Generate checksums
        run: sha256sum main.js manifest.json > checksums.txt
      - name: Publish plugin files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" main.js manifest.json checksums.txt
          --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md --latest
